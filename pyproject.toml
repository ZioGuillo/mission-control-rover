[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robocar"
version = "0.1.0"
requires-python = ">=3.10"
description = "Robot car controller — FastAPI web app for Raspberry Pi and Jetson Nano"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.2",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

# Board-specific GPIO backend — pick the one matching your hardware (see
# app/hardware/gpio_compat.py). scripts/install.sh selects one of these
# automatically; installed by hand otherwise, e.g. `pip install .[pi5]`.
[project.optional-dependencies]
pi = ["RPi.GPIO>=0.7.1"]              # Raspberry Pi 3 / 4
pi5 = ["rpi-lgpio>=0.6"]              # Raspberry Pi 5 (RP1 chip)
jetson = ["Jetson.GPIO>=2.1.0"]       # Jetson Nano / other Jetson boards
camera-fallback = ["opencv-python-headless>=4.9.0"]  # USB/V4L2 camera when picamera2 isn't available

[project.scripts]
robocar = "app.cli:main"

[tool.hatch.build]
include = ["app/**"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- antenna -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="3" fill="#4fc3f7"/>
  <!-- head -->
  <rect x="12" y="14" width="40" height="28" rx="6" fill="#1e88e5"/>
  <!-- eyes -->
  <rect x="18" y="21" width="10" height="8" rx="2" fill="#0d1b2a"/>
  <rect x="36" y="21" width="10" height="8" rx="2" fill="#0d1b2a"/>
  <circle cx="23" cy="25" r="3" fill="#4fc3f7"/>
  <circle cx="41" cy="25" r="3" fill="#4fc3f7"/>
  <!-- mouth -->
  <rect x="20" y="34" width="24" height="4" rx="2" fill="#0d1b2a"/>
  <rect x="22" y="34" width="4" height="4" rx="1" fill="#4fc3f7"/>
  <rect x="30" y="34" width="4" height="4" rx="1" fill="#4fc3f7"/>
  <rect x="38" y="34" width="4" height="4" rx="1" fill="#4fc3f7"/>
  <!-- body -->
  <rect x="16" y="44" width="32" height="16" rx="4" fill="#1565c0"/>
  <!-- chest light -->
  <circle cx="32" cy="52" r="4" fill="#4fc3f7" opacity="0.9"/>
  <!-- ears -->
  <rect x="6" y="20" width="6" height="10" rx="3" fill="#1565c0"/>
  <rect x="52" y="20" width="6" height="10" rx="3" fill="#1565c0"/>
</svg>

<div class="drive-layout">

  <!-- PiP camera feed -->
  <div class="pip-container">
    {% if camera_available %}
    <img id="pip-cam" src="/api/camera/stream"
         style="width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;"
         alt="Live camera"
         onclick="showTab('camera', document.querySelectorAll('.tab-btn')[1])"
         onerror="onStreamError('pip-cam')"
         onload="onStreamLoad('pip-cam')">
    <div id="pip-cam-overlay" class="stream-overlay" style="display:none">
      <button onclick="reconnectStreams()" class="stream-reconnect-btn" title="Reconnect camera">↺</button>
    </div>
    <button id="pip-cam-corner" class="stream-corner-btn"
            onclick="event.stopPropagation();reconnectStreams()" title="Refresh stream">↺</button>
    {% elif camera_stream_url %}
    <iframe src="{{ camera_stream_url }}" scrolling="no"
            title="Live camera"
            onclick="showTab('camera', document.querySelectorAll('.tab-btn')[1])">
    </iframe>
    {% else %}
    <div class="pip-placeholder">📷 No camera configured</div>
    {% endif %}
  </div>

  <!-- Controls -->
  <div class="controls-container">

    <!-- D-pad (rotated 90° CCW: forward=left, reverse=right, right=top, left=bottom) -->
    <div class="dpad">
      <!-- Row 1: top = right -->
      <div></div>
      <button class="dpad-btn" aria-label="Forward"
              onpointerdown="startAction('forward')"
              onpointerup="releaseAction()"
              onpointerleave="releaseAction()">►</button>
      <div></div>
      <!-- Row 2: left=forward, center=stop, right=reverse -->
      <button class="dpad-btn" aria-label="Right"
              onpointerdown="startAction('right')"
              onpointerup="releaseAction()"
              onpointerleave="releaseAction()">▲</button>
      <button class="dpad-btn stop-btn" id="stop-btn" aria-label="Stop"
              onclick="stopAction()">■</button>
      <button class="dpad-btn" aria-label="Left"
              onpointerdown="startAction('left')"
              onpointerup="releaseAction()"
              onpointerleave="releaseAction()">▼</button>
      <!-- Row 3: bottom = left -->
      <div></div>
      <button class="dpad-btn" aria-label="Reverse"
              onpointerdown="startAction('reverse')"
              onpointerup="releaseAction()"
              onpointerleave="releaseAction()">◄</button>
      <div></div>
    </div>

    <!-- Speed slider -->
    <div class="speed-control">
      <label>
        Speed: <strong id="speed-value">75%</strong>
        <input type="range" id="speed-slider" min="0" max="100" value="75"
               oninput="updateSpeed(this.value)">
      </label>
    </div>

    <!-- Auto-drive -->
    <div class="autodrive-section">
      <button class="autodrive-btn" onclick="autoDriveClick()">🤖 Auto-Drive &nbsp; OFF</button>
      <small class="autodrive-status"></small>
    </div>

  </div><!-- /controls-container -->
</div><!-- /drive-layout -->

<h2>Camera</h2>

<div class="camera-stream">
  {% if camera_available %}
  <img id="cam-stream" src="/api/camera/stream"
       style="width:100%;border-radius:10px;background:#111;display:block;"
       alt="Live camera feed"
       onerror="onStreamError('cam-stream')"
       onload="onStreamLoad('cam-stream')">
  <div id="cam-stream-overlay" class="stream-overlay" style="display:none">
    <button onclick="reconnectStreams()" class="stream-reconnect-btn" title="Reconnect camera">↺</button>
  </div>
  <button id="cam-stream-corner" class="stream-corner-btn"
          onclick="reconnectStreams()" title="Refresh stream">↺</button>
  {% elif camera_stream_url %}
  <iframe src="{{ camera_stream_url }}" scrolling="no" title="Camera stream"></iframe>
  {% else %}
  <div class="camera-placeholder">
    📷 No camera detected — connect a Pi CSI camera or set CAMERA_STREAM_URL in .env
  </div>
  {% endif %}
</div>
